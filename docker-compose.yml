services:
  postgres:
    image: postgres:17
    container_name: agentfault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agentfault
    ports:
      - "5432:5432"
    volumes:
      - agentfault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentfault"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agentfault_postgres_data: